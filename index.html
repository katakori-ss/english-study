<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1F5EFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音パケ100">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>音のパッケージ100</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --ink: #16202C;
    --muted: #5B6877;
    --rule: #DCE1E7;
    --accent: #1F5EFF;
    --accent-ink: #FFFFFF;
    --accent-soft: #E6EDFF;
    --danger: #B3261E;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F141A;
      --surface: #171E26;
      --ink: #E8EDF3;
      --muted: #98A4B3;
      --rule: #2A333E;
      --accent: #6C93FF;
      --accent-ink: #0B1220;
      --accent-soft: #1B2A4D;
      --danger: #FF8A80;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- header ---- */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
  }
  .bar-inner { min-height: 52px; display: flex; align-items: center; gap: 4px; }
  .bar-title { margin: 0; padding: 0 8px; font-size: 1rem; font-weight: 700; }
  .bar-spacer { flex: 1; }
  .nav-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 2px;
    min-height: 44px; min-width: 44px; padding: 0 10px;
    border: 0; background: none; border-radius: 10px;
    color: var(--accent); font-size: 1rem; cursor: pointer;
  }
  .nav-btn[aria-disabled="true"] { color: var(--muted); opacity: .4; pointer-events: none; }
  .nav-btn:active { background: var(--accent-soft); }

  /* ---- list ---- */
  .wrap { max-width: 640px; margin: 0 auto; padding-bottom: calc(env(safe-area-inset-bottom) + 28px); }
  .list { list-style: none; margin: 12px 0 0; padding: 0; background: var(--surface); border-block: 1px solid var(--rule); }
  .list li + li { border-top: 1px solid var(--rule); }
  .row {
    display: grid; grid-template-columns: 2.75rem 1fr 1rem; align-items: center; gap: 4px;
    padding: 13px max(16px, env(safe-area-inset-right)) 13px max(16px, env(safe-area-inset-left));
  }
  .row:active { background: var(--accent-soft); }
  .no { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pkg { display: block; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .mean { display: block; margin-top: 2px; font-size: .875rem; color: var(--muted); }
  .chev { color: var(--muted); display: flex; }
  .foot { margin: 14px 16px 0; font-size: .75rem; color: var(--muted); }
  .foot + .foot { margin-top: 4px; }

  /* ---- detail ---- */
  .hero { padding: 22px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
  .hero .no { display: block; margin-bottom: 4px; }
  .hero .meta { display: flex; gap: 12px; }
  .hero-pkg { margin: 0; font-family: var(--serif); font-size: 2.2rem; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
  .hero-mean { margin: 8px 0 0; font-size: 1.05rem; }
  .kata { margin: 4px 0 0; font-size: .95rem; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 0 18px; border-radius: 10px;
    border: 1.5px solid var(--accent); font-size: .95rem; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--accent);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:active { filter: brightness(.92); }
  .btn.playing { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); }
  .note {
    margin: 20px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    padding: 2px 0 2px 12px; border-left: 3px solid var(--accent);
    font-size: .92rem;
  }
  .note b { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
  .sec-title { margin: 26px max(16px, env(safe-area-inset-left)) 0; font-size: .85rem; font-weight: 700; color: var(--muted); }
  .ex { list-style: none; margin: 8px 0 0; padding: 0; background: var(--surface); border-block: 1px solid var(--rule); }
  .ex li { padding: 14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
  .ex li + li { border-top: 1px solid var(--rule); }
  .ex-head { display: flex; align-items: flex-start; gap: 10px; }
  .ex-body { flex: 1; min-width: 0; }
  .ex-en { margin: 0; font-family: var(--serif); font-size: 1.2rem; line-height: 1.35; overflow-wrap: anywhere; }
  .ex-ja { margin: 6px 0 0; font-size: .95rem; }
  .play-pair { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-height: 40px; min-width: 84px; padding: 0 10px; border-radius: 20px;
    border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
    font-size: .8rem; font-weight: 600; cursor: pointer;
  }
  .pill.linked { background: var(--accent); color: var(--accent-ink); }
  .pill:active { filter: brightness(.92); }
  .pill.playing { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); }

  /* ---- editor (spoken spelling) ---- */
  .edit { margin-top: 10px; }
  .edit-label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 3px; }
  .edit-input, .rule-input {
    width: 100%; min-height: 44px; padding: 8px 10px;
    font: 16px/1.3 var(--mono);              /* 16px+ keeps iOS from zooming on focus */
    color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--rule); border-radius: 8px;
  }
  textarea.edit-input { display: block; resize: none; overflow: hidden; }
  .edit-input:focus, .rule-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .edit-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-top: 6px; }
  .edit-src { font-size: .75rem; color: var(--muted); flex: 1 1 140px; overflow-wrap: anywhere; }
  .edit-actions { display: flex; gap: 8px; }
  .chip {
    min-height: 40px; padding: 0 14px; border-radius: 20px;
    border: 1.5px solid var(--rule); background: transparent; color: var(--ink);
    font-size: .8rem; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:active { filter: brightness(.92); }

  /* ---- rules screen ---- */
  .intro { margin: 14px max(16px, env(safe-area-inset-left)) 0; font-size: .85rem; color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px max(16px, env(safe-area-inset-left)) 0; }
  .rules { list-style: none; margin: 14px 0 0; padding: 0; background: var(--surface); border-block: 1px solid var(--rule); }
  .rule { padding: 14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
  .rule + .rule { border-top: 1px solid var(--rule); }
  .rule-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rule-phrase { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
  .rule-arrow { color: var(--muted); }
  .rule-input { flex: 1 1 150px; width: auto; min-width: 0; }
  .rule.is-off .rule-phrase, .rule.is-off .rule-input { opacity: .5; }
  .rule-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: .72rem; font-weight: 700; }
  .tag.confirmed { background: var(--accent); color: var(--accent-ink); }
  .tag.cand { border: 1px solid var(--muted); color: var(--muted); }
  .tag.off { background: var(--rule); color: var(--muted); }
  .rule-note { margin: 6px 0 0; font-size: .78rem; color: var(--muted); }
  .rule-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .rule details { margin-top: 8px; }
  .rule summary { display: flex; align-items: center; min-height: 40px; font-size: .85rem; color: var(--accent); cursor: pointer; }
  .hit { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--rule); }
  .hit-key { flex: none; min-width: 2.6rem; font-size: .8rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hit-body { flex: 1; min-width: 0; }
  .hit-plain { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .hit-text { font-family: var(--serif); font-size: .95rem; overflow-wrap: anywhere; }
  .mini {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
  }
  .mini.playing { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); }
  .export-box { margin: 16px max(16px, env(safe-area-inset-left)) 0; }
  .export-box summary { min-height: 40px; display: flex; align-items: center; font-size: .85rem; color: var(--accent); cursor: pointer; }
  .export-box textarea {
    width: 100%; min-height: 180px; padding: 8px 10px;
    font: 16px/1.35 var(--mono); color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--rule); border-radius: 8px;
  }
  .danger {
    display: block; margin: 22px max(16px, env(safe-area-inset-left)) 0; padding: 8px 0; min-height: 44px;
    border: 0; background: none; color: var(--danger); font-size: .85rem; text-decoration: underline; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
    background: var(--ink); color: var(--bg); font-size: .875rem; z-index: 20;
  }
</style>
</head>
<body>

<header class="bar">
  <div id="barList" class="bar-inner">
    <h1 class="bar-title">音のパッケージ100</h1>
    <span class="bar-spacer"></span>
    <a id="toRules" class="nav-btn" href="#/rules">つなげ読みの規則</a>
  </div>
  <div id="barDetail" class="bar-inner" hidden>
    <a id="back" class="nav-btn" href="#/" aria-label="一覧に戻る">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      一覧
    </a>
    <span class="bar-spacer"></span>
    <a id="prev" class="nav-btn" href="#/" aria-label="前のパッケージ">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a id="next" class="nav-btn" href="#/" aria-label="次のパッケージ">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
  <div id="barRules" class="bar-inner" hidden>
    <a class="nav-btn" href="#/" aria-label="一覧に戻る">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      一覧
    </a>
    <h1 class="bar-title">つなげ読みの規則</h1>
  </div>
</header>

<main id="listView" class="wrap">
  <ol id="list" class="list"></ol>
  <p id="progress" class="foot"></p>
  <p id="voiceInfo" class="foot"></p>
</main>

<main id="detailView" class="wrap" hidden></main>

<main id="rulesView" class="wrap" hidden>
  <p class="intro">綴りを直すと、その規則が当たるすべての文に反映されます。文ごとに手動で編集した文は、規則より手動が優先されます。「確定」「使わない」「綴りの変更」は、このiPhoneのSafariに保存されます。</p>
  <div class="tools">
    <button type="button" class="btn" data-act="export">書き出し（コピー）</button>
  </div>
  <details id="exportBox" class="export-box">
    <summary>書き出した内容</summary>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
  </details>
  <ol id="rulesList" class="rules"></ol>
  <button type="button" class="danger" data-act="reset-all">すべて初期状態に戻す</button>
</main>

<div id="toast" class="toast" role="status" hidden></div>

<script src="data.js"></script>
<script src="speak.js"></script>
<script src="app.js"></script>
</body>
</html>
